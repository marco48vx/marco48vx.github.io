<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Media Gateway</title>
<meta name="referrer" content="no-referrer">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="assets/style.css">
</head>
<body>
<main class="wrap">
  <h1>Media Gateway</h1>
  <p class="sub">Paste a video link to generate a private playback link on this domain.</p>

  <form id="form" autocomplete="off">
    <input id="source" type="text" placeholder="https://www.youtube.com/watch?v=..." spellcheck="false" required>
    <button type="submit">Generate link</button>
  </form>

  <p id="error" class="error" hidden></p>

  <section id="result" class="result" hidden>
    <label for="output">Your link</label>
    <div class="row">
      <input id="output" type="text" readonly>
      <button id="copy" type="button">Copy</button>
    </div>
    <a id="open" class="open" href="#">Open player</a>
  </section>
</main>
<script src="assets/codec.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
